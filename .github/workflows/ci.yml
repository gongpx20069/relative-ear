name: Android checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Check release scripts
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Build and validate
        run: bash gradlew :core:test :app:testDebugUnitTest :app:assembleDebug :app:lintDebug :app:assembleDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare UI diagnostics
        run: |
          mkdir -p app/build
          printf 'Run: %s\nCommit: %s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > app/build/ui-environment.log
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - name: Install compilation SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise training UI and database upgrades
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          # Reuse the compilation platform; the emulator runtime remains Android 10.
          api-level: 35
          system-image-api-level: 29
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 1536
          disable-animations: true
          script: |
            bash gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --console plain
            adb install -r app/build/outputs/apk/debug/app-x86_64-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            # Run the complete suite once; keep the app installed until output collection finishes.
            adb shell am instrument -w -e listener io.github.gongpx20069.relativeear.UiReportListener io.github.gongpx20069.relativeear.test/androidx.test.runner.AndroidJUnitRunner | tee app/build/ui-capture.log
            mkdir -p app/build/ui-snapshots
            adb pull /sdcard/Android/data/io.github.gongpx20069.relativeear/files/ui-snapshots/. app/build/ui-snapshots/
            python scripts/validate_instrumentation.py --report app/build/ui-snapshots/instrumentation-results.xml --log app/build/ui-capture.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-snapshots
          path: |
            app/build/ui-snapshots/
            app/build/ui-capture.log
            app/build/ui-environment.log
          if-no-files-found: error
