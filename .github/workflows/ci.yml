name: Android checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Check release scripts
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Build and validate
        run: bash gradlew :core:test :app:testDebugUnitTest :app:assembleDebug :app:lintDebug :app:assembleDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - name: Install compilation SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise training UI and database upgrades
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Reuse the compilation platform; the emulator runtime remains Android 10.
          api-level: 35
          system-image-api-level: 29
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 1536
          disable-animations: true
          script: |
            bash gradlew :app:connectedDebugAndroidTest --no-daemon --console plain
            # Gradle uninstalls apps after connected tests; an adb-owned capture session retains the images.
            adb install -r app/build/outputs/apk/debug/app-x86_64-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class io.github.gongpx20069.relativeear.TrainingUiTest,io.github.gongpx20069.relativeear.HistoryUiTest io.github.gongpx20069.relativeear.test/androidx.test.runner.AndroidJUnitRunner | tee app/build/ui-capture.log
            grep -Eq '^OK \([1-9][0-9]* tests?\)' app/build/ui-capture.log
            mkdir -p app/build/ui-snapshots
            adb pull /sdcard/Android/data/io.github.gongpx20069.relativeear/files/ui-snapshots/. app/build/ui-snapshots/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-snapshots
          path: |
            app/build/ui-snapshots/*.png
            app/build/reports/androidTests/connected/
            app/build/ui-capture.log
          if-no-files-found: error
